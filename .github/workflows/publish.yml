name: Tag & Publish Typescript SDK (npm)

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Specify version (leave empty for auto-increment)"
        required: false
        default: ""

concurrency:
  group: tag-and-publish
  cancel-in-progress: false

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Validate version override
        if: github.event.inputs.version_override != ''
        run: |
          if [[ ! "${{ github.event.inputs.version_override }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_override '${{ github.event.inputs.version_override }}' is not a valid X.Y.Z version"
            exit 1
          fi

      - name: Get package name and determine version
        id: package_info
        run: |
          set -euo pipefail

          # Extract package name from package.json
          PACKAGE_NAME=$(bun pm pkg get name)
          PACKAGE_NAME=${PACKAGE_NAME//\"/}
          echo "Package name: $PACKAGE_NAME"

          if [[ "${{ github.event.inputs.version_override }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version_override }}"
            echo "Using manually specified version: $VERSION"
          else
            # Package must already exist on npm — fail loudly if it doesn't
            # or if the registry query fails for any reason.
            NPM_VERSION=$(bun pm view "$PACKAGE_NAME" version 2>&1) || {
              echo "::error::Failed to fetch version for $PACKAGE_NAME from npm:"
              echo "$NPM_VERSION"
              exit 1
            }
            echo "Current npm version: $NPM_VERSION"

            IFS='.' read -r major minor patch <<< "$NPM_VERSION"
            VERSION="$major.$minor.$((patch + 1))"
            echo "Incrementing to version $VERSION"
          fi

          TAG="v$VERSION"

          # Fail early if this tag already exists, instead of after publishing
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: bun pm version ${{ steps.package_info.outputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and create tag
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: release ${{ steps.package_info.outputs.tag }}"
          git tag -a ${{ steps.package_info.outputs.tag }} -m "Release ${{ steps.package_info.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.package_info.outputs.tag }}